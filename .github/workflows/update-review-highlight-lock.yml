name: Temporary review highlight lock update

on:
  push:
    branches:
      - feature/review-known-words-export
    paths:
      - .github/workflows/update-review-highlight-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and update lock
        run: npm install

      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update package lock for syntax highlighting"
            git push
          fi

      - name: Build
        run: npm run build
